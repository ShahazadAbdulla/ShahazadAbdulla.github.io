- title: Selected Technical Projects
  type: list
  contents:
    - <b>Autonomous Lane-Keeping Perception System:</b> Developed a ROS 2 perception node by integrating the Ultrafast Lane Detection (UFLD) model to accurately identify lane boundaries from real-world video feeds.
    - <b>End-to-End Object Detection Pipeline in Simulation:</b> Architected and implemented a complete ROS 2 perception pipeline in Gazebo, successfully streaming data from a simulated TurtleBot3 camera to a YOLOv5 node and visualizing real-time object detections in RViz2.
    - <b>Self-Balancing Robot with Kalman Filter:</b> Engineered a complete control system in C++ for a physical self-balancing robot on a RISC-V board, implementing a Kalman filter and PID controller for stable state estimation.
    - <b>NeuraHome:</b> AI-powered home automation system enabling control via natural language and hand gestures.
    - <b>Smart Interactive Mirror:</b> Intelligent mirror using computer vision to analyze user expressions and provide personalized feedback.

